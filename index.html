<title>VERITΛS Range</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VERITΛS">
<meta name="theme-color" content="#16191b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=Share+Tech+Mono&display=swap">
<style>
:root{
  --ground:#eceee9; --surface:#ffffff; --sunk:#e1e4de; --ink:#16191b; --ink2:#454c48; --muted:#6c746f;
  --line:#cfd4cd; --accent:#e2531c; --accent-ink:#ffffff; --accent-soft:#fbe3d8;
  --good:#23804a; --warn:#b7791f; --bad:#c2352b; --lcd:#16191b; --lcd-ink:#ff8a3d; --lcd-dim:#3a3f3c;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Source Sans 3",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Share Tech Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--ground:#0f1211;--surface:#191d1b;--sunk:#222725;--ink:#e8ebe7;--ink2:#bcc3be;--muted:#8c948f;
  --line:#2f3532;--accent:#ff7038;--accent-ink:#140a05;--accent-soft:#3a1f14;--good:#4cc17a;--warn:#e0a445;--bad:#ff6b5e;
  --lcd:#070908;--lcd-ink:#ff8a3d;--lcd-dim:#2a2f2c;}}
:root[data-theme="dark"]{
  color-scheme:dark;--ground:#0f1211;--surface:#191d1b;--sunk:#222725;--ink:#e8ebe7;--ink2:#bcc3be;--muted:#8c948f;
  --line:#2f3532;--accent:#ff7038;--accent-ink:#140a05;--accent-soft:#3a1f14;--good:#4cc17a;--warn:#e0a445;--bad:#ff6b5e;
  --lcd:#070908;--lcd-ink:#ff8a3d;--lcd-dim:#2a2f2c;}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:34px;text-transform:uppercase}
h2{font-size:26px;text-transform:uppercase}
h3{font-size:20px}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* top bar */
.top{display:flex;align-items:flex-end;justify-content:space-between;padding:8px 0 14px;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.back{border:0;background:none;padding:10px 12px 10px 0;min-height:44px;color:var(--accent);font-weight:700;display:inline-flex;align-items:center;gap:4px}

.wm{display:flex;flex-direction:column;line-height:.9}
.wm-name{font:700 36px/1 var(--display);letter-spacing:.04em}
.wm-name .lam{display:inline-block;transform:rotate(180deg)}
.wm-sub{font:600 12px/1 var(--body);letter-spacing:.34em;text-transform:uppercase;color:var(--accent);margin-top:5px;padding-left:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}

/* drill list */
.group-h{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.group-h .count{font:14px var(--mono);color:var(--muted)}
.drill{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.drill:active{transform:scale(.99)}
.drill .name{font:700 21px/1.1 var(--display);text-transform:uppercase}
.drill .meta{grid-column:1/2;font-size:14px;color:var(--muted)}
.drill .par{grid-row:1/3;grid-column:2;text-align:right}
.drill .par b{display:block;font:22px/1 var(--mono);color:var(--ink)}
.drill .par span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tag{display:inline-block;font:600 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:4px;background:var(--sunk);color:var(--ink2)}
.tag.hot{background:var(--accent-soft);color:var(--accent)}
.note{background:var(--sunk);border-radius:10px;padding:12px 14px;font-size:15px;color:var(--ink2)}
.note b{color:var(--ink)}

/* drill detail */
.spec{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.spec div{background:var(--surface);padding:10px 8px;text-align:center}
.spec b{display:block;font:20px/1.1 var(--mono)}
.spec span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.steps li::marker{font-family:var(--mono);color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:10px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:7px;padding:9px;font-weight:700;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.variant{border-left:3px solid var(--accent);padding:4px 0 4px 12px;color:var(--ink2);font-size:15px}

.btn{border:0;border-radius:12px;padding:15px 18px;font:700 20px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;
  background:var(--accent);color:var(--accent-ink);width:100%}
.btn.alt{background:var(--sunk);color:var(--ink)}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn.small{font-size:16px;padding:10px 14px;width:auto;border-radius:9px}
.btn:disabled{opacity:.45}

/* timer */
.lcd{background:var(--lcd);border-radius:16px;padding:18px 18px 14px;color:var(--lcd-ink);position:relative;overflow:hidden}
.lcd .status{font:15px var(--mono);letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between;color:#c9cfca;opacity:.85}
.lcd .digits{font:clamp(72px,24vw,118px)/1 var(--mono);text-align:right;margin:12px 0 6px;letter-spacing:-.02em}
.lcd .digits .ghost{color:var(--lcd-dim)}
.lcd .sub{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid #2a2f2c;padding-top:10px}
.lcd .sub div{font:12px var(--mono);letter-spacing:.1em;color:#9aa29d;text-transform:uppercase}
.lcd .sub b{display:block;font:22px var(--mono);color:#f3f5f2;letter-spacing:0}
.lcd.live .status .dot{color:var(--lcd-ink)}
.lcd.standby .digits{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.lcd.standby .digits{animation:none}}
.meter{height:10px;background:var(--lcd-dim);border-radius:5px;position:relative;margin-top:12px;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:#8fd19e;width:0;transition:width 60ms linear}
.meter .th{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--lcd-ink)}
.shots{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:40vh;overflow:auto}
.shots li{display:grid;grid-template-columns:44px 1fr 1fr 40px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-family:var(--mono)}
.shots li:last-child{border-bottom:0}
.shots .n{color:var(--muted)}
.shots .t{font-size:20px}
.shots .s{color:var(--ink2)}
.shots button{border:0;background:none;color:var(--muted);font-size:20px;padding:4px}
.shots .empty{display:block;color:var(--muted);font-family:var(--body);text-align:center;padding:18px}
.bigbtn{min-height:84px;font-size:26px;border-radius:16px}
.bigbtn.stop{background:var(--ink);color:var(--ground)}
.warnbar{border:1.5px solid var(--warn);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:15px}

/* review */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stepper.two{grid-template-columns:repeat(2,1fr)}
.zone{background:var(--sunk);border-radius:10px;padding:8px;text-align:center}
.zone .z{font:700 18px var(--display);letter-spacing:.06em}
.zone .v{font:34px/1.1 var(--mono);margin:2px 0}
.zone .pm{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.zone .pm button{border:0;border-radius:8px;background:var(--surface);font:700 22px/1 var(--body);padding:10px 0}
.zone.miss .z{color:var(--bad)}
.results{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.results div{background:var(--surface);padding:10px}
.results span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.results b{display:block;font:22px/1.2 var(--mono)}
.results b.good{color:var(--good)} .results b.bad{color:var(--bad)}
textarea,select,input[type=text],input[type=number]{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:64px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}

/* progress */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{padding:2px 0}
.stat span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font:24px/1.15 var(--mono)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--ground);border-radius:8px;padding:6px 9px;font-size:13px;line-height:1.3;white-space:nowrap;transform:translate(-50%,-110%)}
.chart .tip b{font-family:var(--mono);font-size:15px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.hist .d{color:var(--ink2)}
.hist .d small{display:block;color:var(--muted);font-size:12px}
.hist .num{text-align:right}
.hist button{border:0;background:none;color:var(--muted);font-size:18px}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px}

/* qualifications */
.qbar{display:flex;gap:3px}
.qbar i{flex:1;height:8px;border-radius:2px;background:var(--sunk)}
.qbar i.done{background:var(--good)} .qbar i.bad{background:var(--bad)} .qbar i.cur{background:var(--accent)}
.qstages{list-style:none;margin:0;padding:0;counter-reset:q}
.qstages li{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.qstages li:first-child{border-top:0;padding-top:0}
.qstages .muted{font-size:13px}
.go{display:inline-block;font:700 12px/1 var(--body);letter-spacing:.08em;padding:4px 7px;border-radius:4px}
.go.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.go.no{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.qin{width:100%;min-width:0;border:0;background:var(--surface);border-radius:8px;text-align:center;padding:8px 0;font:24px/1.1 var(--mono)}
.qin::-webkit-inner-spin-button,.qin::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.qin{-moz-appearance:textfield;appearance:textfield}
.zone .pts{font-size:12px;color:var(--muted);margin-bottom:6px}
.tablewrap{overflow-x:auto}
.qtable{width:100%;border-collapse:collapse;font-size:15px}
.qtable th{text-align:left;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line)}
.qtable td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
label.switch.card{gap:14px}
/* free timer */
.parset{display:grid;grid-template-columns:1fr 1fr 1.6fr 1fr 1fr;gap:6px;align-items:center}
.parset button{border:0;background:var(--sunk);border-radius:9px;height:44px;font:700 16px var(--body)}
.parset b{text-align:center;font-size:30px}
.parset small{font-size:14px;color:var(--muted);margin-left:2px}
.free.busy{opacity:.55;pointer-events:none}
/* plans */
.planline{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:14px}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--ink);color:var(--ground);border-radius:12px;padding:14px}
.resume .eyebrow,.resume .muted{color:inherit;opacity:.7}
.plist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pitem{display:grid;grid-template-columns:1fr auto;grid-template-areas:"m r" "o o";gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.pitem:last-child{border-bottom:0}
.pmain{grid-area:m;display:flex;flex-direction:column}
.pmain b{font:700 19px/1.1 var(--display);text-transform:uppercase}
.pmain .muted{font-size:13px}
.reps{grid-area:r;display:flex;align-items:center;gap:6px}
.reps span{min-width:34px;text-align:center;font-size:18px}
.reps button,.order button{border:0;background:var(--sunk);border-radius:8px;width:36px;height:36px;font:700 18px/1 var(--body)}
.order{grid-area:o;display:flex;gap:6px;justify-content:flex-end}
.order button:disabled{opacity:.3}
.pick-h{font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.pick{display:grid;grid-template-columns:1fr auto 28px;gap:8px;align-items:center;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:10px 0;text-align:left}
.pick b{color:var(--accent);font-size:22px;text-align:center}
.pick .muted{font-size:13px}
.queue{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.qrow{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 12px;text-align:left}
.queue li:last-child .qrow{border-bottom:0}
.qrow .qi{font:15px var(--mono);color:var(--muted);text-align:center}
.qrow .qn{font-weight:600;display:flex;flex-direction:column}
.qrow .qn small{font-weight:400;color:var(--muted);font-family:var(--mono)}
.qrow.cur{background:var(--accent-soft)} .qrow.cur .qi{color:var(--accent)}
.qrow.done .qs{color:var(--good)} .qrow.skip .qn{color:var(--muted);text-decoration:line-through}
.now h1{font-size:30px}
.repline{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:15px}
/* settings */
.set{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .spread b{font-family:var(--mono)}
input[type=range]{width:100%;accent-color:var(--accent);height:32px}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch input{width:24px;height:24px;accent-color:var(--accent)}

/* tabbar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;width:100%}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font:600 12px var(--body);letter-spacing:.04em}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{width:24px;height:24px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:999px;font-weight:600;z-index:9;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style>
</head>

function compute(s){
  if(s.results) return computeQual(s);
  const d=byId(s.drillId); const shots=s.shots||[]; const n=shots.length;
  const raw=n?shots[n-1]:(s.manual?s.manual.total:0); const first=n?shots[0]:(s.manual&&s.manual.first?s.manual.first:null);
  const splits=shots.slice(1).map((t,i)=>t-shots[i]);
  const spread=splits.length>1?Math.max(...splits)-Math.min(...splits):null;
  const avgSplit=splits.length?splits.reduce((a,b)=>a+b,0)/splits.length:null;
  let points=null,hf=null,acc=null,time=raw,miss=0;
  const type=d?d.scoring:"hits";
  if(type==="zones"){const z=s.score||{A:0,C:0,D:0,M:0}; miss=z.M||0;
    points=Math.max(0,5*z.A+3*z.C+1*z.D-10*miss); const possible=5*(z.A+z.C+z.D+miss||1);
    acc=(5*z.A+3*z.C+1*z.D)/possible; hf=raw>0?points/raw:0;}
  else{const z=s.score||{H:0,M:0}; miss=z.M||0; const tot=(z.H+miss)||1; acc=z.H/tot; time=raw+miss*((d&&d.penaltySec)||0);}
  return {n,raw,first,splits,spread,avgSplit,points,hf,acc,time,miss,type};
}

function seedSamples(){
  const now=Date.now(),day=864e5; let seed=7; const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  const mk=(drillId,i,total,base,imp,spl)=>{
    const t0=base-imp*(i/(total-1))+(rnd()-.5)*.18; const shots=[+t0.toFixed(2)];
    const cnt=byId(drillId).rounds;
    for(let k=1;k<cnt;k++){let sp=spl*(1-.18*i/(total-1))+(rnd()-.5)*.06; if(drillId==="fast"&&k===2) sp=1.9-.4*i/(total-1)+(rnd()-.5)*.2; shots.push(+(shots[k-1]+sp).toFixed(2));}
    return shots;};
  for(let i=0;i<9;i++){const shots=mk("bill",i,9,1.45,.3,.31); const a=Math.min(6,3+Math.round(i/3+rnd()*1.5)); const m=i<2&&rnd()>.5?1:0;
    DB.sessions.push({id:"s-b"+i,drillId:"bill",date:now-(40-i*4.5)*day,start:"lowready",shots,score:{A:Math.max(0,a-m),C:6-Math.max(0,a-m)-m,D:0,M:m},notes:"",sample:true});}
  for(let i=0;i<6;i++){const shots=mk("fast",i,6,1.2,.2,.3); const m=i<3?(rnd()>.4?1:0):0;
    DB.sessions.push({id:"s-f"+i,drillId:"fast",date:now-(38-i*6)*day,start:"lowready",shots,score:{H:6-m,M:m},notes:"",sample:true});}
}

const Audio_={ctx:null,stream:null,node:null,micOK:null,level:0,onShot:null,onLevel:null};
const WORKLET=`
class ShotDetector extends AudioWorkletProcessor{
  constructor(){super();this.th=.5;this.hold=.08*sampleRate;this.armAt=Infinity;this.mutes=[];this.last=-1e12;this.peak=0;this.pc=0;
    this.port.onmessage=e=>{const d=e.data;if(d.th!=null)this.th=d.th;if(d.hold!=null)this.hold=d.hold*sampleRate;
      if(d.armAt!=null){this.armAt=d.armAt*sampleRate;this.last=-1e12;} if(d.disarm)this.armAt=Infinity; if(d.mutes)this.mutes=d.mutes.map(m=>[m[0]*sampleRate,m[1]*sampleRate]);};}
  process(inputs){const ch=inputs[0]&&inputs[0][0];if(!ch)return true;let m=0;const base=currentFrame;
    for(let i=0;i<ch.length;i++){const v=ch[i]<0?-ch[i]:ch[i];if(v>m)m=v;
      if(v>=this.th){const f=base+i;if(f>=this.armAt&&f-this.last>=this.hold){let muted=false;for(const w of this.mutes){if(f>=w[0]&&f<=w[1]){muted=true;break;}}
        if(!muted){this.last=f;this.port.postMessage({shot:f/sampleRate});}}}}
    if(m>this.peak)this.peak=m;if(++this.pc>=8){this.port.postMessage({level:this.peak});this.peak=0;this.pc=0;}return true;}}
registerProcessor('shot-detector',ShotDetector);`;
function thresholdFor(sens){return 0.95-(sens-1)*0.095} // 1 → 0.95 (least sensitive), 10 → 0.095
async function ensureCtx(){
  if(!Audio_.ctx){const AC=window.AudioContext||window.webkitAudioContext; Audio_.ctx=new AC({latencyHint:"interactive"});}
  if(Audio_.ctx.state!=="running"){try{await Audio_.ctx.resume()}catch(e){}}
  return Audio_.ctx;
}
async function ensureMic(){
  if(Audio_.micOK) return true;
  const ctx=await ensureCtx();
  try{
    if(navigator.audioSession){try{navigator.audioSession.type="play-and-record"}catch(e){}}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error("no-mic-api");
    Audio_.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const src=ctx.createMediaStreamSource(Audio_.stream); const sink=ctx.createGain(); sink.gain.value=0; sink.connect(ctx.destination);
    let node;
    if(ctx.audioWorklet&&window.AudioWorkletNode){
      const url=URL.createObjectURL(new Blob([WORKLET],{type:"application/javascript"}));
      await ctx.audioWorklet.addModule(url);
      node=new AudioWorkletNode(ctx,"shot-detector",{numberOfInputs:1,numberOfOutputs:1,outputChannelCount:[1]});
      node.port.onmessage=e=>{const d=e.data; if(d.shot!=null&&Audio_.onShot)Audio_.onShot(d.shot); if(d.level!=null){Audio_.level=d.level; Audio_.onLevel&&Audio_.onLevel(d.level);}};
      Audio_.post=m=>node.port.postMessage(m);
    }else{ // fallback for older browsers
      node=ctx.createScriptProcessor(256,1,1); const st={th:.5,hold:.08,armAt:Infinity,mutes:[],last:-1e9};
      node.onaudioprocess=e=>{const ch=e.inputBuffer.getChannelData(0);const t0=ctx.currentTime-ch.length/ctx.sampleRate;let m=0;
        for(let i=0;i<ch.length;i++){const v=Math.abs(ch[i]);if(v>m)m=v;const t=t0+i/ctx.sampleRate;
          if(v>=st.th&&t>=st.armAt&&t-st.last>=st.hold&&!st.mutes.some(w=>t>=w[0]&&t<=w[1])){st.last=t;Audio_.onShot&&Audio_.onShot(t);}}
        Audio_.level=m;Audio_.onLevel&&Audio_.onLevel(m);};
      Audio_.post=m=>{if(m.th!=null)st.th=m.th;if(m.hold!=null)st.hold=m.hold;if(m.armAt!=null){st.armAt=m.armAt;st.last=-1e9;}if(m.disarm)st.armAt=Infinity;if(m.mutes)st.mutes=m.mutes;};
    }
    src.connect(node); node.connect(sink); Audio_.node=node; Audio_.micOK=true;
    applyDetectorSettings(); return true;
  }catch(e){Audio_.micOK=false; return false;}
}
function applyDetectorSettings(){if(Audio_.post)Audio_.post({th:thresholdFor(DB.settings.sensitivity),hold:DB.settings.echoMs/1000});}
function beep(at,dur=.3,hz){
  const ctx=Audio_.ctx; hz=hz||DB.settings.beepHz;
  const g=ctx.createGain(); g.gain.setValueAtTime(0,at); g.gain.linearRampToValueAtTime(.9,at+.005); g.gain.setValueAtTime(.9,at+dur-.01); g.gain.linearRampToValueAtTime(0,at+dur);
  const o=ctx.createOscillator(); o.type="square"; o.frequency.value=hz; o.connect(g);
  const o2=ctx.createOscillator(); o2.type="square"; o2.frequency.value=hz*1.5; const g2=ctx.createGain(); g2.gain.value=.35; o2.connect(g2); g2.connect(g);
  g.connect(ctx.destination); o.start(at); o2.start(at); o.stop(at+dur+.02); o2.stop(at+dur+.02);
  return [o,o2];
}

const stageName=(d,i)=>d.stages[i].name?`Stage ${i+1} · ${d.stages[i].name}`:`Stage ${i+1}`;

function stringResult(st,shots){
  if(!shots) return null;
  if(!Array.isArray(shots)){const splitFail=!!(st.maxSplit&&shots.maxSplit>st.maxSplit+1e-9);const over=shots.time>st.par+1e-9;
    return {time:shots.time,late:over?Math.max(shots.late||0,0):0,go:!over&&!splitFail,splitFail,count:null,manual:true,over};}
  const time=shots.length?shots[shots.length-1]:null;
  const late=shots.filter(t=>t>st.par+1e-9).length;
  let splitFail=false; if(st.maxSplit) for(let i=1;i<shots.length;i++) if(shots[i]-shots[i-1]>st.maxSplit+1e-9) splitFail=true;
  const go=time!=null&&time<=st.par+1e-9&&!splitFail;
  return {time,late,go,splitFail,count:shots.length};
}
function computeQual(s){
  const d=byId(s.drillId); let totalTime=0,late=0,allGo=true,strings=0;
  const stages=d.stages.map((st,i)=>{const rs=(s.results[i]||[]).map(sh=>stringResult(st,sh));
    rs.forEach(r=>{if(!r){allGo=false;return;} strings++; totalTime+=r.time||0; late+=r.late; if(!r.go)allGo=false;}); return rs;});
  const z=s.score||{A:0,C:0,D:0,M:0}; const P=d.points;
  let points=z.A*P.A+z.C*P.C+z.D*P.D;
  const topValue=Math.max(P.A,P.C,P.D);

  const pass=points>=d.pass&&(d.lateRule!=="fail"||allGo);
  const hits=z.A+z.C+z.D; const acc=d.rounds?hits/d.rounds:0;

}

/* ---- Timer ---- */
function newRun(drillId){const dd=drillId&&byId(drillId);return {drillId,state:"idle",beepAt:0,shots:[],par:dd?dd.par[dd.fixedStart||startPos()]:null,raf:0,timeout:0,lastShotWall:0};}
function vTimer(){
  if(!S.run) S.run=newRun(null);
  if(S.run.qual) return vQualTimer();
  const r=S.run; const d=r.drillId?byId(r.drillId):null;
  const st=DB.settings; const dryUI=!d&&st.freeMode==="dry";
  app.innerHTML=header("",d?"drill-back":"drills")+`<div class="stack">${d?planBanner(d.id):""}
    <div class="spread"><div><span class="eyebrow">${d?d.skill:st.freeMode==="dry"?"Dry fire":"Free timer"}</span><h2 style="margin-top:4px">${d?d.name:r.label||"Shot timer"}</h2></div>
      ${d?`<span class="tag">${d.rounds} rd · par ${r.par.toFixed(1)}</span>`:""}</div>
    ${d?"":freeControls(r)}
    ${Audio_.micOK===false&&!(!d&&st.freeMode==="dry")?`<div class="warnbar"><b>Microphone unavailable.</b> Shot detection is off, so tap the button below for each shot. To use the mic, allow microphone access for this site in Safari settings and reload.</div>`:""}
    <div class="lcd" id="lcd"><div class="status"><span id="lcdState">Ready</span><span>${st.randomDelay?`Delay ${st.delayMin}–${st.delayMax}s`:`Delay ${st.delayMin}s`}</span></div>
      <div class="digits" id="digits"><span class="ghost">0.00</span></div>
      <div class="sub" ${dryUI?"hidden":""}><div>Shots<b id="sN">0</b></div><div>First<b id="sF">–</b></div><div>Split<b id="sS">–</b></div></div>
      ${dryUI?`<div class="sub"><div>Par<b>${st.freeParOn?st.freePar.toFixed(2):"off"}</b></div><div>Reps<b id="dReps">${r.reps||0}</b></div><div>Repeat<b>${st.dryRepeat?st.dryGap+" s":"off"}</b></div></div>`:""}
      <div class="meter" aria-hidden="true" ${dryUI?"hidden":""}><i id="mBar"></i><span class="th" id="mTh"></span></div></div>
    <ul class="shots" id="shotList" ${dryUI?"hidden":""}><li class="empty">Shots appear here with their split times.</li></ul>
    <div id="ctl"></div></div>`;
  document.getElementById("mTh").style.left=(thresholdFor(st.sensitivity)*100)+"%";
  drawTimer(); drawControls(); startMeter();
}
function freeControls(r){const st=DB.settings,dry=st.freeMode==="dry",busy=r.state!=="idle"||r.repeating;
  return `<div class="card stack free ${busy?"busy":""}">
    <div class="seg" role="group" aria-label="Timer mode"><button type="button" data-fmode="live" aria-pressed="${!dry}">Live fire</button><button type="button" data-fmode="dry" aria-pressed="${dry}">Dry fire</button></div>
    <p class="muted" style="font-size:14px">${dry?"No microphone. A start beep, then a second beep at your par time.":"The microphone records every shot. Add a par beep for any drill that isn't in the list."}</p>
    <label class="switch" for="fparOn"><span><b>Par beep</b></span><input type="checkbox" id="fparOn" ${st.freeParOn?"checked":""}></label>
    ${st.freeParOn?`<div class="parset"><button type="button" data-fpar="-1">−1</button><button type="button" data-fpar="-0.1">−.1</button><b class="mono">${st.freePar.toFixed(2)}<small>s</small></b><button type="button" data-fpar="0.1">+.1</button><button type="button" data-fpar="1">+1</button></div>`:""}
    ${dry?`<label class="switch" for="drep"><span><b>Repeat until I stop</b><br><span class="muted" style="font-size:14px">Resets and runs the next rep on its own.</span></span><input type="checkbox" id="drep" ${st.dryRepeat?"checked":""}></label>
      ${st.dryRepeat?`<div class="spread"><span>Time to reset between reps</span><div class="reps"><button type="button" data-fgap="-1" aria-label="Less time">−</button><span class="mono">${st.dryGap} s</span><button type="button" data-fgap="1" aria-label="More time">+</button></div></div>`:""}`:""}
  </div>`;}
function drawControls(){const r=S.run,c=document.getElementById("ctl"); if(!c)return;
  if(r.state==="idle"&&r.repeating) c.innerHTML=`<button class="btn bigbtn stop" type="button" data-act="stop">Stop repeating</button>`;
  else if(r.state==="idle") c.innerHTML=`<button class="btn bigbtn" type="button" data-act="start">Start</button>`;
  else if(Audio_.micOK===false&&r.state==="live"&&!r.dry) c.innerHTML=`<div class="stack"><button class="btn bigbtn" type="button" data-act="tapshot">Tap: Shot</button><button class="btn bigbtn stop" type="button" data-act="stop">Stop</button></div>`;
  else c.innerHTML=`<button class="btn bigbtn stop" type="button" data-act="stop">${r.state==="standby"?"Cancel":"Stop"}</button>`;}
function drawTimer(){const r=S.run; const lcd=document.getElementById("lcd"); if(!lcd)return;
  lcd.className="lcd "+r.state; const n=r.shots.length;
  document.getElementById("lcdState").innerHTML=r.state==="idle"?"Ready":r.state==="standby"?"Standby":(r.dry?`<span class="dot">●</span> Go`:`<span class="dot">●</span> Listening`);
  const dr=document.getElementById("dReps"); if(dr) dr.textContent=r.reps||0;
  document.getElementById("sN").textContent=n; document.getElementById("sF").textContent=n?f2(r.shots[0]):"–";
  document.getElementById("sS").textContent=n>1?f2(r.shots[n-1]-r.shots[n-2]):"–";
  if(r.state==="idle") document.getElementById("digits").innerHTML=n?f2(r.shots[n-1]):`<span class="ghost">0.00</span>`;
  const list=document.getElementById("shotList");
  list.innerHTML=n?r.shots.map((t,i)=>`<li><span class="n">#${i+1}</span><span class="t" ${r.par&&t>r.par?'style="color:var(--bad)"':""}>${f2(t)}</span><span class="s">${i?"+"+f2(t-r.shots[i-1]):"first"}</span><span></span></li>`).reverse().join(""):`<li class="empty">Shots appear here with their split times.</li>`;}
function tick(){const r=S.run; if(!r||r.state==="idle")return; const el=document.getElementById("digits");
  if(el){ if(r.state==="standby") el.textContent="– –";
    else {const n=r.shots.length; const now=Audio_.ctx.currentTime-r.beepAt; el.textContent=f2(Math.max(0,now));}}
  if(r.state==="standby"&&Audio_.ctx.currentTime>=r.beepAt){r.state="live";drawTimer();drawControls();}
  if(r.dry){ if(r.state==="live"&&(r.par?Audio_.ctx.currentTime-r.beepAt>=r.par+.35:Audio_.ctx.currentTime-r.beepAt>60)){finishRun(true);return;} }
  else{
  if(r.state==="live"&&r.shots.length&&Audio_.ctx.currentTime-r.beepAt-r.shots[r.shots.length-1]>8){finishRun();return;}
  if(r.state==="live"&&!r.shots.length&&Audio_.ctx.currentTime-r.beepAt>30){finishRun();return;}}
  r.raf=requestAnimationFrame(tick);}
async function startRun(){
  const r=S.run; const st=DB.settings;
  if(!r.drillId&&!r.qual){r.dry=st.freeMode==="dry"; r.par=st.freeParOn?st.freePar:null;}
  await ensureCtx(); if(!r.dry){ if(Audio_.micOK!==true) await ensureMic(); applyDetectorSettings(); } const delay=st.randomDelay?st.delayMin+Math.random()*(st.delayMax-st.delayMin):st.delayMin;
  await ensureCtx(); const ctx=Audio_.ctx; r.shots=[]; r.state="standby"; r.beepAt=ctx.currentTime+delay; r.nodes=beep(r.beepAt);
  const mutes=[]; if((r.drillId||r.qual?st.parBeep:true)&&r.par){r.nodes.push(...beep(r.beepAt+r.par,.25,st.beepHz*0.75));mutes.push([r.beepAt+r.par-.02,r.beepAt+r.par+.3]);}
  if(Audio_.post&&!r.dry) Audio_.post({armAt:r.beepAt+.32,mutes});
  if(r.dry) Audio_.onShot=null; else Audio_.onShot=t=>{if(S.run!==r||r.state==="idle")return; addShot(t-r.beepAt);};
  keepAwake(true); drawTimer(); drawControls(); cancelAnimationFrame(r.raf); r.raf=requestAnimationFrame(tick);
}
function addShot(t){const r=S.run; if(t<0)return; r.shots.push(+t.toFixed(3)); drawTimer();
  const d=r.drillId&&byId(r.drillId); const need=r.qual?qualStage(r).rounds:(d&&d.rounds); if((r.qual||DB.settings.autoStop)&&need&&r.shots.length>=need) setTimeout(()=>{if(S.run===r&&r.state!=="idle")finishRun();},150);}
function finishRun(completed){const r=S.run; cancelAnimationFrame(r.raf); if(Audio_.post)Audio_.post({disarm:true}); Audio_.onShot=null;
  const wasStandby=r.state==="standby"; r.state="idle"; keepAwake(false);
  (r.nodes||[]).forEach(o=>{try{o.stop()}catch(e){}}); r.nodes=[];
  if(r.dry){ if(completed===true){r.reps=(r.reps||0)+1; const el=document.getElementById("digits"); if(el&&r.par) el.textContent=f2(r.par);
      if(r.repeating){clearTimeout(r.rt); r.rt=setTimeout(()=>{if(S.run===r&&r.repeating&&r.state==="idle"&&S.view==="timer")startRun();},DB.settings.dryGap*1000);} }
    drawTimer(); drawControls(); if(completed===true&&r.par){const el=document.getElementById("digits"); if(el) el.textContent=f2(r.par);} return;}
  if(wasStandby||!r.shots.length){ drawTimer();drawControls(); if(!wasStandby)toast("No shots detected"); return;}
  if(r.qual){qualStringDone();return;}
  const d=r.drillId&&byId(r.drillId);
  const score=d&&d.scoring==="zones"?{A:r.shots.length,C:0,D:0,M:0}:{H:r.shots.length,M:0};
  S.review={drillId:r.drillId,shots:r.shots.slice(),score,notes:"",start:(d&&d.fixedStart)||startPos(),date:Date.now()};
  go("review");}
let meterOn=false;
function startMeter(){meterOn=true; Audio_.onLevel=lv=>{const b=document.getElementById("mBar"); if(b)b.style.width=Math.min(100,lv*100)+"%";};}
function stopMeter(){meterOn=false; Audio_.onLevel=null;}

/* ---- Review ---- */
function vReview(){
  const rv=S.review; const d=rv.drillId&&byId(rv.drillId); const m=compute(rv);
  const par=d?d.par[rv.start]:null;
  const zoneUI=!d?"":d.scoring==="zones"
    ?`<div class="stepper">${["A","C","D","M"].map(z=>`<div class="zone ${z==="M"?"miss":""}"><div class="z">${z==="M"?"MISS":z}</div><div class="v">${rv.score[z]}</div><div class="pm"><button type="button" data-z="${z}" data-d="-1" aria-label="Minus ${z}">−</button><button type="button" data-z="${z}" data-d="1" aria-label="Plus ${z}">+</button></div></div>`).join("")}</div>`
    :`<p class="muted" style="font-size:14px;margin-top:-4px">Hit = inside ${esc(d.zone)}</p><div class="stepper two">${["H","M"].map(z=>`<div class="zone ${z==="M"?"miss":""}"><div class="z">${z==="M"?"MISS":"HIT"}</div><div class="v">${rv.score[z]}</div><div class="pm"><button type="button" data-z="${z}" data-d="-1" aria-label="Minus">−</button><button type="button" data-z="${z}" data-d="1" aria-label="Plus">+</button></div></div>`).join("")}</div>`;
  const hitsEntered=d?(d.scoring==="zones"?rv.score.A+rv.score.C+rv.score.D+rv.score.M:rv.score.H+rv.score.M):0;
  const timeCls=par&&m.time<=par?"good":par?"bad":"";
  app.innerHTML=`<div class="top"></div>`+`<div class="stack">
    <div><span class="eyebrow">Review run</span><h2 style="margin-top:4px">${d?d.name:"Free timer"}</h2></div>
    <div class="results">
      <div><span>${d&&d.penaltySec?"Time + pen.":"Time"}</span><b class="${timeCls}">${f2(m.time)}</b></div>
      <div><span>First shot</span><b>${f2(m.first)}</b></div>
      <div><span>Avg split</span><b>${f2(m.avgSplit)}</b></div>
      ${d&&d.scoring==="zones"?`<div><span>Points</span><b>${m.points}</b></div><div><span>Hit factor</span><b>${m.hf.toFixed(3)}</b></div>`:`<div><span>Hits</span><b>${d?pct(m.acc):"–"}</b></div><div><span>Split spread</span><b>${f2(m.spread)}</b></div>`}
      ${d&&d.standard?`<div><span>Par ${par.toFixed(1)}</span><b class="${m.miss===0&&m.time<=par?"good":"bad"}">${m.miss===0&&m.time<=par?"PASS":"FAIL"}</b></div>`:`<div><span>Par</span><b>${par?par.toFixed(1):"–"}</b></div>`}</div>
    ${d?`<div class="stack"><div class="spread"><h3>Score your target</h3><span class="muted" style="font-size:14px">${hitsEntered} of ${d.rounds} rounds</span></div>${zoneUI}</div>`:""}
    ${!rv.shots.length&&rv.manual?`<p class="note">Times entered from your own shot timer.</p>`:""}
    <div class="stack" ${!rv.shots.length&&rv.manual?"hidden":""}><div class="spread"><h3>Shots</h3><span class="muted" style="font-size:14px">${rv.src==="own"?"From your timer":"Tap × to drop a false shot"}</span></div>
      <ul class="shots">${rv.shots.map((t,i)=>`<li><span class="n">#${i+1}</span><span class="t">${f2(t)}</span><span class="s">${i?"+"+f2(t-rv.shots[i-1]):"first"}</span><button type="button" data-rm="${i}" aria-label="Remove shot ${i+1}">×</button></li>`).join("")}</ul></div>
    <label class="f" for="notes">Notes<textarea id="notes" placeholder="What to fix next run: grip, trigger, eyes…">${esc(rv.notes)}</textarea></label>
    ${d&&playFor(d.id)?(()=>{const it=playFor(d.id);const more=it.done+1<it.reps;
      return `<p class="planline"><span><b>${esc(P().name)}</b> · this is run ${it.done+1} of ${it.reps}</span></p>
      <button class="btn bigbtn" type="button" data-act="${more?"psave-again":"psave-next"}">${more?"Save · run again":"Save · next drill"}</button>
      <div class="row"><button class="btn alt small" type="button" data-act="${more?"psave-next":"psave-again"}">${more?"Save · next drill":"Save · run again"}</button><button class="btn ghost small" type="button" data-act="discard">Discard</button></div>`;})()
    :d?`<button class="btn bigbtn" type="button" data-act="save">Save run</button><div class="row"><button class="btn alt small" type="button" data-act="save-again">Save and run again</button><button class="btn ghost small" type="button" data-act="discard">Discard</button></div>`
    :`<button class="btn bigbtn" type="button" data-act="discard">Done</button>`}
  </div>`;
  document.getElementById("notes").addEventListener("input",e=>rv.notes=e.target.value);
}
function saveReview(){const rv=S.review; const sid="s"+Date.now(); recordPlayRun(rv.drillId,sid); DB.sessions.push({id:sid,drillId:rv.drillId,date:rv.date,start:rv.start,shots:rv.shots,score:rv.score,notes:rv.notes,manual:rv.manual||undefined,src:rv.src||undefined});
  save(); toast(storageOK?"Run saved":"Saved for this visit only; storage is blocked");}

/* ---- Progress ---- */
function vProgress(){
  const withRuns=DRILLS.filter(d=>sessionsFor(d.id).length);
  if(!S.progressDrill||!byId(S.progressDrill)) S.progressDrill=(withRuns[0]||DRILLS[0]).id;
  const d=byId(S.progressDrill); const ss=sessionsFor(d.id); const ms=d.qual?[]:ss.map(compute);
  const opts=DRILLS.map(x=>`<option value="${x.id}" ${x.id===d.id?"selected":""}>${x.name}${sessionsFor(x.id).length?` (${sessionsFor(x.id).length})`:""}</option>`).join("");
  const anySample=DB.sessions.some(s=>s.sample);
  let body;
  if(!ss.length) body=`<p class="note">No runs logged for ${d.name} yet. Shoot it from the Drills tab and your times will chart here.</p>`;
  else if(d.qual) body=qualProgressBody(d,ss);

function niceTicks(min,max,count){const span=max-min||1;const step0=span/count;const mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const step=[1,2,2.5,5,10].map(s=>s*mag).find(s=>s>=step0);const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;const t=[];for(let v=lo;v<=hi+1e-9;v+=step)t.push(+v.toFixed(6));return t;}
function lineChart(id,ss,vals,o){
  const el=document.getElementById(id); const W=420,H=170,L=40,R=10,T=14,B=26;
  let lo=Math.min(...vals,o.ref??Infinity),hi=Math.max(...vals,o.ref??-Infinity); if(o.max!=null)hi=Math.max(hi,o.max);
  const pad=(hi-lo)*.12||hi*.1||1; lo=Math.max(0,lo-pad); hi=o.max!=null?o.max:hi+pad; let ticks=niceTicks(lo,hi,4); if(o.max!=null)ticks=ticks.filter(t=>t<=o.max); lo=ticks[0]; hi=o.max!=null?o.max:ticks[ticks.length-1];
  const n=vals.length; const x=i=>n===1?L+(W-L-R)/2:L+i*(W-L-R)/(n-1); const y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const grid=ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="13" fill="var(--muted)" font-family="Share Tech Mono,monospace">${+t.toFixed(2)}</text>`).join("");
  const path=vals.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const area=n>1?`<path d="${path}L${x(n-1)},${H-B}L${x(0)},${H-B}Z" fill="var(--accent)" opacity=".10"/>`:"";
  const ref=o.ref!=null?`<line x1="${L}" x2="${W-R}" y1="${y(o.ref)}" y2="${y(o.ref)}" stroke="var(--ink2)" stroke-dasharray="4 4" stroke-width="1.25"/><text x="${W-R}" y="${y(o.ref)-5}" text-anchor="end" font-size="13" fill="var(--ink2)">${o.refLabel} ${o.ref}</text>`:"";
  const dateLbl=i=>new Date(ss[i].date).toLocaleDateString(undefined,{month:"short",day:"numeric"});
  const xl=n>1?`<text x="${x(0)}" y="${H-6}" font-size="13" fill="var(--muted)">${dateLbl(0)}</text><text x="${x(n-1)}" y="${H-6}" font-size="13" text-anchor="end" fill="var(--muted)">${dateLbl(n-1)}</text>`:"";
  const dots=vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===n-1?5:3.5}" fill="${i===n-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="2"/>`).join("");
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Chart of ${n} runs">${grid}${ref}${area}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>${xl}
    <line id="${id}x" y1="${T}" y2="${H-B}" stroke="var(--ink2)" stroke-width="1" opacity="0"/>${dots}<rect x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent" id="${id}hit"/></svg><div class="tip" hidden></div>`;
  const svg=el.querySelector("svg"),tip=el.querySelector(".tip"),cross=document.getElementById(id+"x");
  const show=e=>{const r=svg.getBoundingClientRect();const px=(e.clientX-r.left)*W/r.width;
    let i=n===1?0:Math.round((px-L)/((W-L-R)/(n-1)));i=Math.max(0,Math.min(n-1,i));
    cross.setAttribute("x1",x(i));cross.setAttribute("x2",x(i));cross.setAttribute("opacity",".5");
    tip.hidden=false;tip.style.left=(x(i)*r.width/W)+"px";tip.style.top=(y(vals[i])*r.height/H)+"px";
    tip.innerHTML=`${dateLbl(i)}<br><b>${o.fmt(vals[i])}</b>`;};
  const hide=()=>{tip.hidden=true;cross.setAttribute("opacity","0");};
  svg.addEventListener("pointermove",show);svg.addEventListener("pointerdown",show);svg.addEventListener("pointerleave",hide);
}

app.addEventListener("click",async e=>{
  const b=e.target.closest("button"); if(!b)return;
  if(b.dataset.filter){S.filter=b.dataset.filter;render();return;}
  if(b.dataset.drill){go("drill",{drillId:b.dataset.drill});return;}
  if(b.dataset.pos){S.start=b.dataset.pos;render();return;}
  if(b.dataset.defpos){DB.settings.start=b.dataset.defpos;S.start=null;save();render();return;}

    if(b.dataset.fmode){st.freeMode=b.dataset.fmode;r.label=null;}

  if(b.dataset.planEdit){S.editPlanId=b.dataset.planEdit;S.confirmPlanDel=null;go("planEdit");return;}

    pl.items.push({drillId:b.dataset.did,reps:byId(b.dataset.did).qual?1:5});pl.example=false;save();S.addOpen=null;render();toast(`Added to ${pl.name}`);return;}
  if(b.dataset.padd||b.dataset.rep!=null||b.dataset.mv!=null||b.dataset.prm!=null){const pl=DB.plans.find(x=>x.id===S.editPlanId);pl.example=false;
    if(b.dataset.padd){pl.items.push({drillId:b.dataset.padd,reps:byId(b.dataset.padd).qual?1:5});toast(byId(b.dataset.padd).name+" added");}
    else if(b.dataset.rep!=null){const it=pl.items[+b.dataset.rep];it.reps=Math.max(1,Math.min(20,it.reps+(+b.dataset.d)));}
    else if(b.dataset.mv!=null){const i=+b.dataset.mv,j=i+(+b.dataset.d);[pl.items[i],pl.items[j]]=[pl.items[j],pl.items[i]];}
    else pl.items.splice(+b.dataset.prm,1);
    save();render();return;}
  if(b.dataset.jump!=null){const p=P();p.idx=+b.dataset.jump;p.items[p.idx].skipped=false;save();S.confirmEnd=false;render();window.scrollTo(0,0);return;}
  if(b.dataset.qrm!=null){const q=S.run.qual;q.results[q.last.stage][q.last.string].splice(+b.dataset.qrm,1);render();return;}
  if(b.dataset.z){const rv=S.review;const z=b.dataset.z;rv.score[z]=Math.max(0,rv.score[z]+(+b.dataset.d));render();return;}
  if(b.dataset.rm!=null){S.review.shots.splice(+b.dataset.rm,1);render();return;}
  if(b.dataset.ask){S.confirmDel=b.dataset.ask;render();return;}
  if(b.dataset.del){DB.sessions=DB.sessions.filter(s=>s.id!==b.dataset.del);S.confirmDel=null;save();render();toast("Run deleted");return;}
  const a=b.dataset.act; if(!a)return;

  else if(a==="qual-resume"){go("timer");}
  else if(a==="qual-back"){const r=S.run;if(r.state!=="idle"){r.shots=[];finishRun();}if(playFor(r.drillId))go("play");else go("drill",{drillId:r.drillId});}
  else if(a==="qual-redo"){const r=S.run,q=r.qual,d=byId(r.drillId);q.stage=q.last.stage;q.string=q.last.string;q.results[q.stage][q.string]=null;if(q.tries)q.tries[q.stage]++;q.done=false;q.last=null;r.par=d.stages[q.stage].par;r.shots=[];render();}
  else if(a==="qual-score"){const r=S.run,q=r.qual;const qd=byId(r.drillId);const n=q.results.reduce((t,arr,i)=>t+arr.reduce((u,x)=>u+(x?(Array.isArray(x)?x.length:qd.stages[i].rounds):0),0),0);

  else if(a==="qual-save"){const rv=S.qreview;const sid="s"+Date.now();const pit=recordPlayRun(rv.drillId,sid);DB.sessions.push({id:sid,drillId:rv.drillId,date:rv.date,start:rv.mod?"lowready":"holster",mod:rv.mod,results:rv.results,score:rv.score,notes:rv.notes});

  else if(a==="plan-del"){S.confirmPlanDel=S.editPlanId;render();}
  else if(a==="plan-del-no"){S.confirmPlanDel=null;render();}
  else if(a==="plan-del-yes"){DB.plans=DB.plans.filter(x=>x.id!==S.editPlanId);save();S.confirmPlanDel=null;go("plans");toast("Plan deleted");}
  else if(a==="play"){go("play");}
  else if(a==="play-shoot"){openShoot(curItem().drillId);}
  else if(a==="play-next"){playAdvance();go("play");}

    if(a==="psave-again"){openShoot(id);}else{playAdvance();go("play");}}

  else if(a.startsWith("prog-")){S.progressDrill=a.slice(5);go("progress");}

  else if(a==="discard"||a==="review-discard"){const rv=S.review,id=rv&&rv.drillId;S.review=null;if(rv&&rv.src==="own"){S.manualDrill=id;go("manual");}else{S.run=newRun(id);go("timer");}}
  else if(a.startsWith("manual-")&&a!=="manual-next"&&a!=="manual-back"){S.manualDrill=a.slice(7);go("manual");}
  else if(a==="manual-back"){go("drill",{drillId:S.manualDrill});}
  else if(a==="manual-next"){const d=byId(S.manualDrill);
    let list=String(document.getElementById("mShots").value||"").trim().split(/[\s,;]+/).map(parseNum).filter(x=>x!=null);
    if(list.some((t,i)=>i&&t<=list[i-1])){toast("Shot times should count up from the beep");return;}
    let total=parseNum(document.getElementById("mTotal").value), first=parseNum(document.getElementById("mFirst").value);

    if(first&&first>total){toast("First shot can't be later than the total");return;}
    const n=d.rounds;
    S.review={drillId:d.id,shots:list,manual:list.length?null:{total,first},src:"own",score:d.scoring==="zones"?{A:n,C:0,D:0,M:0}:{H:n,M:0},notes:"",start:d.fixedStart||startPos(),date:Date.now()};
    go("review");}
  else if(a==="src-own"||a==="src-phone"){DB.settings.timerSource=a==="src-own"?"own":"phone";save();render();}
  else if(a==="qual-manual"){const r=S.run,q=r.qual,st=byId(r.drillId).stages[q.stage];
    const time=parseNum(document.getElementById("qmTime").value); if(!time){toast("Enter the string time");return;}
    const lateEl=document.getElementById("qmLate"),splitEl=document.getElementById("qmSplit");
    qualStringDone({manual:true,time,late:lateEl?Math.max(0,parseInt(lateEl.value,10)||0):0,maxSplit:splitEl?parseNum(splitEl.value):null});}
  else if(a==="testbeep"){await ensureCtx();beep(Audio_.ctx.currentTime+.05);}
  else if(a==="mictest"){const ok=await ensureMic();const ms=document.getElementById("micState");if(ms)ms.textContent=ok?"Mic on":"Mic blocked";if(!ok)toast("Microphone is blocked");}
  else if(a==="export"){const t=backupText();try{await navigator.clipboard.writeText(t);toast("Backup copied");}catch(err){const ta=document.getElementById("imp");ta.value=t;ta.select();toast("Select all and copy");}}
  else if(a==="download"){const blob=new Blob([backupText()],{type:"application/json"});const u=URL.createObjectURL(blob);const l=document.createElement("a");l.href=u;l.download="veritas-range-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}
  else if(a==="import"){try{const d=JSON.parse(document.getElementById("imp").value);if(!Array.isArray(d.sessions))throw 0;
      const ids=new Set(DB.sessions.map(s=>s.id));let added=0;d.sessions.forEach(s=>{if(!ids.has(s.id)&&byId(s.drillId)){DB.sessions.push(s);added++;}});
      if(Array.isArray(d.plans)){const pids=new Set(DB.plans.map(x=>x.id));d.plans.forEach(pl=>{if(!pids.has(pl.id))DB.plans.push(pl);});}
      save();render();toast(`Restored ${added} runs`);}catch(err){toast("That text is not a VERITΛS Range backup");}}
  else if(a==="clearsamples"){DB.sessions=DB.sessions.filter(s=>!s.sample);save();render();toast("Sample runs cleared");}
});
app.addEventListener("change",e=>{const t=e.target;if(t.id!=="fparOn"&&t.id!=="drep")return;const r=S.run;if(r&&(r.state!=="idle"||r.repeating)){t.checked=!t.checked;return;}
  if(t.id==="fparOn")DB.settings.freeParOn=t.checked; else DB.settings.dryRepeat=t.checked; save(); render();});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.run&&S.run.state!=="idle")keepAwake(true);});

load(); render();
</script>
